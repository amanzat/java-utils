# Releases the current -SNAPSHOT version: drops the suffix, dates the changelog's [Unreleased] notes,
# publishes to Maven Central and tags the release.
# Run "Prepare next version" afterwards to open the next development version.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

# never cancel a run in progress: the window between publishing and pushing must not be interrupted
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the dispatched revision is still the head of dev
        run: |
          head=$(git ls-remote origin refs/heads/dev | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::dev has moved on: dispatched $GITHUB_SHA, head is $head"
            exit 1
          fi

      - name: Check the changelog has release notes
        # fails before anything is built, changed or published
        id: changelog
        run: python3 .github/scripts/release-notes.py check

      - name: Check the previous release tag exists
        run: |
          # the new compare link starts at this tag, so it has to exist
          previous="v${{ steps.changelog.outputs.previous }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$previous" >/dev/null 2>&1; then
            echo "::error::the changelog's latest release is ${{ steps.changelog.outputs.previous }}, but tag $previous does not exist"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Resolve the release version
        id: release
        run: |
          current=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version"))')
          case "$current" in
            *-SNAPSHOT) ;;
            *) echo "::error::the version is $current, releasing needs a -SNAPSHOT version"; exit 1 ;;
          esac
          version=${current%-SNAPSHOT}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version"

      - name: Check the tag does not exist yet
        run: |
          # checkout does not fetch tags, so ask the remote rather than the local repository
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::tag ${{ steps.release.outputs.tag }} already exists"
            exit 1
          fi

      - name: Set the release version
        run: mvn -B -ntp versions:set -DremoveSnapshot=true -DgenerateBackupPoms=false

      - name: Date the changelog and bump the readme
        run: python3 .github/scripts/release-notes.py apply "${{ steps.release.outputs.version }}" "$(date -u +%F)"

      - name: Commit and tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release ${{ steps.release.outputs.version }}"
          git tag -a "${{ steps.release.outputs.tag }}" -m "release ${{ steps.release.outputs.version }}"

      - name: Check the push would succeed
        # publishing is irreversible, so fail here rather than after the artifacts are on Central
        run: git push --dry-run origin HEAD:dev "${{ steps.release.outputs.tag }}"

      - name: Publish to Maven Central
        run: mvn -B -ntp deploy -Pgpg-sign --file pom.xml
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Push the release commit and tag
        run: git push origin HEAD:dev "${{ steps.release.outputs.tag }}"

      - name: Create the GitHub release
        # after the push, so the tag already exists on the remote
        run: |
          python3 - "${{ steps.release.outputs.version }}" <<'PY' > release-notes.md
          import sys
          from pathlib import Path
          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text().split("\n")
          start = next(i for i, line in enumerate(lines) if line.startswith(f"## [{version}] - "))
          end = next(i for i in range(start + 1, len(lines)) if lines[i].startswith("## "))
          print("\n".join(lines[start + 1:end]).strip())
          PY
          # --verify-tag: fail rather than inventing a tag if the push above did not land
          gh release create "${{ steps.release.outputs.tag }}" \
            --verify-tag \
            --title "${{ steps.release.outputs.tag }}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
