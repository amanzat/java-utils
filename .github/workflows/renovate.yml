name: renovate

on:
  schedule:
    # inside the Monday 00:00-03:59 UTC window that schedule:weekly allows branch creation in
    - cron: '17 1 * * 1'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # this action publishes no moving major tag, so the exact version is pinned
      - uses: renovatebot/github-action@v46.2.5
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: Adrian Manzat <32832404+amanzat@users.noreply.github.com>
