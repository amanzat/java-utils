# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  # lets a snapshot be published by hand: bot pushes trigger nothing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      snapshot: ${{ steps.version.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn -B -ntp verify --file pom.xml
      - name: Check whether the version is a snapshot
        id: version
        run: |
          version=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          case "$version" in
            *-SNAPSHOT) snapshot=true ;;
            *)          snapshot=false ;;
          esac
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          echo "version $version, snapshot=$snapshot"

  snapshot:
    name: Publish snapshot
    needs: build
    # only on dev, and only while the version is a -SNAPSHOT
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' && needs.build.outputs.snapshot == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: snapshot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Check the commit is still the head of dev
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/dev | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dev has moved on to $head, not publishing $GITHUB_SHA"
          fi

      - name: Set up JDK 21
        if: steps.head.outputs.current == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD

      # snapshots are not validated by the portal, so they need neither signing nor the gpg key
      - name: Publish the snapshot to Maven Central
        if: steps.head.outputs.current == 'true'
        run: mvn -B -ntp deploy -DskipTests --file pom.xml
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_TOKEN }}
